<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Age Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d0d0d;
      --surface: #141414;
      --card: #1a1a1a;
      --border: #2a2a2a;
      --accent: #c8f03a;
      --accent2: #3affc8;
      --text: #f0ede6;
      --muted: #666;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* animated grid bg */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(200,240,58,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(200,240,58,0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    .wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease both;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      font-weight: 900;
      line-height: 1.05;
      margin-bottom: 8px;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    h1 span { color: var(--accent); }

    .subtitle {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      margin-bottom: 36px;
      animation: fadeUp 0.5s 0.15s ease both;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      animation: fadeUp 0.5s 0.2s ease both;
    }

    .input-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 10px;
    }

    input[type="date"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      cursor: pointer;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(200,240,58,0.12);
    }

    button {
      width: 100%;
      padding: 16px;
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: 10px;
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(200,240,58,0.3);
    }

    button:active { transform: translateY(0); }

    .error {
      color: #ff6b6b;
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }

    /* Results */
    .results {
      margin-top: 28px;
      display: none;
      animation: fadeUp 0.45s ease both;
    }

    .results.show { display: block; }

    .results-title {
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .age-display {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .age-block {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 12px;
      text-align: center;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .age-block:first-child {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(200,240,58,0.08);
    }

    .age-block .num {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      display: block;
    }

    .age-block:not(:first-child) .num {
      color: var(--accent2);
    }

    .age-block .unit {
      font-size: 10px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-top: 6px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .detail-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-item .d-label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .detail-item .d-val {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
    }

    .next-bday {
      margin-top: 10px;
      background: linear-gradient(135deg, rgba(58,255,200,0.06), rgba(200,240,58,0.06));
      border: 1px solid rgba(58,255,200,0.2);
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 12px;
      color: var(--accent2);
      grid-column: span 2;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes countUp {
      from { opacity: 0; transform: scale(0.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .num { animation: countUp 0.4s ease both; }
  </style>
</head>
<body>
<div class="wrapper">
  <div class="badge">&#9679; Age Calculator</div>
  <h1>How old<br>are <span>you?</span></h1>
  <p class="subtitle">Enter your date of birth below</p>

  <div class="card">
    <div class="input-group">
      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" />
      <p class="error" id="error">Please select a valid date of birth.</p>
    </div>
    <button onclick="calculate()">Calculate My Age →</button>

    <div class="results" id="results">
      <p class="results-title">Your Age Breakdown</p>

      <div class="age-display">
        <div class="age-block">
          <span class="num" id="years">0</span>
          <span class="unit">Years</span>
        </div>
        <div class="age-block">
          <span class="num" id="months">0</span>
          <span class="unit">Months</span>
        </div>
        <div class="age-block">
          <span class="num" id="days">0</span>
          <span class="unit">Days</span>
        </div>
      </div>

      <div class="details-grid">
        <div class="detail-item">
          <span class="d-label">Total Days</span>
          <span class="d-val" id="totalDays">–</span>
        </div>
        <div class="detail-item">
          <span class="d-label">Total Weeks</span>
          <span class="d-val" id="totalWeeks">–</span>
        </div>
        <div class="detail-item">
          <span class="d-label">Total Hours</span>
          <span class="d-val" id="totalHours">–</span>
        </div>
        <div class="detail-item">
          <span class="d-label">Total Minutes</span>
          <span class="d-val" id="totalMins">–</span>
        </div>
        <div class="next-bday" id="nextBday"></div>
      </div>
    </div>
  </div>
</div>

<script>
  // Set max date to today
  const dobInput = document.getElementById('dob');
  const today = new Date();
  dobInput.max = today.toISOString().split('T')[0];

  function calculate() {
    const val = dobInput.value;
    const err = document.getElementById('error');
    const results = document.getElementById('results');

    if (!val) {
      err.style.display = 'block';
      results.classList.remove('show');
      return;
    }

    const dob = new Date(val);
    if (dob > today) {
      err.style.display = 'block';
      results.classList.remove('show');
      return;
    }

    err.style.display = 'none';

    // Years, months, days
    let y = today.getFullYear() - dob.getFullYear();
    let m = today.getMonth() - dob.getMonth();
    let d = today.getDate() - dob.getDate();

    if (d < 0) {
      m--;
      const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
      d += prevMonth.getDate();
    }
    if (m < 0) { y--; m += 12; }

    document.getElementById('years').textContent = y;
    document.getElementById('months').textContent = m;
    document.getElementById('days').textContent = d;

    // Totals
    const diffMs = today - dob;
    const totalDays = Math.floor(diffMs / 86400000);
    const totalWeeks = Math.floor(totalDays / 7);
    const totalHours = Math.floor(diffMs / 3600000);
    const totalMins = Math.floor(diffMs / 60000);

    document.getElementById('totalDays').textContent = totalDays.toLocaleString();
    document.getElementById('totalWeeks').textContent = totalWeeks.toLocaleString();
    document.getElementById('totalHours').textContent = totalHours.toLocaleString();
    document.getElementById('totalMins').textContent = totalMins.toLocaleString();

    // Next birthday
    let nextBday = new Date(today.getFullYear(), dob.getMonth(), dob.getDate());
    if (nextBday <= today) nextBday.setFullYear(today.getFullYear() + 1);
    const daysLeft = Math.ceil((nextBday - today) / 86400000);
    const options = { month: 'long', day: 'numeric' };
    const bdayStr = nextBday.toLocaleDateString('en-US', options);

    document.getElementById('nextBday').textContent = daysLeft === 0
      ? '🎉 Happy Birthday! Today is your birthday!'
      : `🎂 Next birthday on ${bdayStr} — ${daysLeft} day${daysLeft !== 1 ? 's' : ''} away`;

    // Animate
    results.classList.remove('show');
    void results.offsetWidth;
    results.classList.add('show');

    // Re-trigger number animation
    ['years','months','days'].forEach(id => {
      const el = document.getElementById(id);
      el.style.animation = 'none';
      void el.offsetWidth;
      el.style.animation = '';
    });
  }

  dobInput.addEventListener('keydown', e => { if (e.key === 'Enter') calculate(); });
</script>
</body>
</html>
